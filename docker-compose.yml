# MediAccess AI — Docker Compose
# Stage 5: MongoDB for local development. Backend/frontend containers are
# added in later stages.
#
# Usage:
#   docker compose up -d mongodb    # start MongoDB
#   docker compose ps               # check status
#   docker compose down             # stop (data volume persists)
#   docker compose down -v          # stop AND delete the data volume
#
# Security notes (local development):
# - No authentication is enabled because MongoDB is bound to 127.0.0.1 only
#   (not reachable from other machines). Credentials/authentication are
#   configured via environment variables when deploying to GCP.

services:
  mongodb:
    image: mongo:8                       # official MongoDB image
    container_name: medaccess-mongodb
    restart: unless-stopped               # development restart policy
    ports:
      # Loopback-only: local development access without exposing the DB.
      - "127.0.0.1:27017:27017"
    volumes:
      - mongodb_data:/data/db             # persistent named volume
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  mongodb_data:
    name: medaccess_mongodb_data
